<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Antoine — Robotique</title>
  <meta name="description" content="Portfolio d'Antoine, étudiant ingénieur en robotique autonome à Polytech Nice Sophia : S.T.A.R., systèmes embarqués, PCB, vision par ordinateur.">
  <meta property="og:title" content="Antoine — Portfolio robotique">
  <meta property="og:description" content="Vision par ordinateur, électronique embarquée, PCB et CAO. Projet phare : S.T.A.R., tourelle anti-drone autonome.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <!-- Les fichiers du site sont rechargés à chaque visite, pour que les modifications se voient tout de suite -->
  <script>window.V = Date.now(); document.write('<link rel="stylesheet" href="style.css?v=' + window.V + '">');</script>
  <noscript><link rel="stylesheet" href="style.css"></noscript>
</head>
<body data-page="accueil">
  <a class="skip" href="#contenu" data-t>Aller au contenu</a>

  <header class="nav">
    <div class="wrap nav-in">
      <a class="nav-nom" href="#haut" id="nav-nom">Antoine</a>
      <nav aria-label="Sections">
        <a href="#phare">S.T.A.R.</a>
        <a href="#projets" data-t>Projets</a>
        <a href="#parcours" data-t>Parcours</a>
        <a href="#contact" data-t>Contact</a>
      </nav>
      <button class="langue mono" id="langue" type="button"><span data-l="fr">FR</span><span class="sep" aria-hidden="true">/</span><span data-l="en">EN</span></button>
    </div>
  </header>

  <main id="contenu">
    <section class="hero wrap" id="haut">
      <div class="hero-texte">
        <p class="eyebrow" id="h-ecole"></p>
        <h1 id="h-nom"></h1>
        <p class="hero-titre" id="h-titre"></p>
        <p class="hero-accroche" id="h-accroche"></p>
        <p class="dispo" id="h-dispo"></p>
        <div class="actions" id="h-actions"></div>
      </div>

    </section>

    <section class="phare" id="phare" aria-labelledby="phare-titre"></section>

    <section class="wrap bloc" id="projets" aria-labelledby="projets-titre">
      <div class="bloc-tete">
        <h2 id="projets-titre" data-t>Autres projets</h2>
        <p class="bloc-sous" data-t>Électronique, cartes sur mesure et premiers robots.</p>
      </div>
      <div class="grille-projets" id="liste-projets"></div>
    </section>


    <section class="wrap bloc" id="parcours" aria-labelledby="parcours-titre">
      <div class="bloc-tete">
        <h2 id="parcours-titre" data-t>Parcours</h2>
      </div>
      <ol class="parcours" id="liste-parcours"></ol>
    </section>

    <section class="wrap bloc contact" id="contact" aria-labelledby="contact-titre">
      <div class="bloc-tete">
        <h2 id="contact-titre" data-t>Contact</h2>
        <p class="bloc-sous" data-t>Stage, projet, question sur S.T.A.R. : écrivez-moi.</p>
      </div>
      <div class="contact-in" id="contact-in"></div>
    </section>
  </main>

  <footer class="wrap pied">
    <table class="cartouche mono" id="cartouche"></table>
  </footer>

  <dialog id="visionneuse" aria-label="Image agrandie">
    <button class="fermer" id="fermer" aria-label="Close">✕</button>
    <img id="visionneuse-img" alt="">
    <p id="visionneuse-leg"></p>
  </dialog>

  <script>
    /* Si contenu.js contient une faute de frappe, on affiche la ligne en cause en haut de la page. */
    window.addEventListener("error", function (e) {
      if (!/contenu\.js/.test(e.filename || "")) return;
      var d = document.createElement("div");
      d.className = "erreur-contenu";
      d.textContent = "Erreur dans contenu.js, ligne " + e.lineno + " : " + e.message + ". En général : une virgule, un guillemet ou une accolade } oubliés juste avant cette ligne.";
      document.body.prepend(d);
    });
  </script>
  <!-- contenu.js est rechargé à chaque visite (pas de cache), pour que tes modifications se voient tout de suite -->
  <script>document.write('<script src="contenu.js?v=' + window.V + '"><\/script>');</script>
  <script>document.write('<script src="app.js?v=' + window.V + '"><\/script>');</script>
</body>
</html>
