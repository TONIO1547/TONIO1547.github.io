<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Antoine — Robotique</title>
  <meta name="description" content="Portfolio d'Antoine, étudiant ingénieur en robotique autonome à Polytech Nice Sophia : S.T.A.R., systèmes embarqués, PCB, vision par ordinateur.">
  <meta property="og:title" content="Antoine — Portfolio robotique">
  <meta property="og:description" content="Vision par ordinateur, électronique embarquée, PCB et CAO. Projet phare : S.T.A.R., tourelle anti-drone autonome.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#contenu">Aller au contenu</a>

  <header class="nav">
    <div class="wrap nav-in">
      <a class="nav-nom" href="#haut" id="nav-nom">Antoine</a>
      <nav aria-label="Sections">
        <a href="#phare">S.T.A.R.</a>
        <a href="#projets">Projets</a>
        <a href="#competences">Compétences</a>
        <a href="#parcours">Parcours</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main id="contenu">
    <section class="hero wrap" id="haut">
      <div class="hero-texte">
        <p class="eyebrow" id="h-ecole"></p>
        <h1 id="h-nom"></h1>
        <p class="hero-titre" id="h-titre"></p>
        <p class="hero-accroche" id="h-accroche"></p>
        <p class="dispo" id="h-dispo"></p>
        <div class="actions" id="h-actions"></div>
      </div>

      <figure class="viseur" aria-label="Simulation du suivi d'une cible par la tourelle">
        <div class="viseur-bar mono">
          <span><i class="rec"></i>SUIVI · SIMULATION</span>
          <span id="v-fps">CAM 0</span>
        </div>
        <canvas id="viseur" width="640" height="440"></canvas>
        <div class="viseur-data mono">
          <div><span>AZ</span><b id="v-az">0.0°</b></div>
          <div><span>SITE</span><b id="v-el">0.0°</b></div>
          <div><span>ERREUR</span><b id="v-err">0 px</b></div>
          <div><span>CIBLE</span><b id="v-cible">verrouillée</b></div>
        </div>
        <figcaption>Le réticule suit la cible avec un asservissement filtré, comme la tourelle S.T.A.R.</figcaption>
      </figure>
    </section>

    <section class="phare" id="phare" aria-labelledby="phare-titre"></section>

    <section class="wrap bloc" id="projets" aria-labelledby="projets-titre">
      <div class="bloc-tete">
        <h2 id="projets-titre">Autres projets</h2>
        <p class="bloc-sous">Électronique, cartes sur mesure et premiers robots.</p>
      </div>
      <div class="grille-projets" id="liste-projets"></div>
    </section>

    <section class="wrap bloc" id="competences" aria-labelledby="comp-titre">
      <div class="bloc-tete">
        <h2 id="comp-titre">Compétences</h2>
        <p class="bloc-sous">Ce que j'ai mis en pratique sur mes projets.</p>
      </div>
      <div class="grille-comp" id="liste-comp"></div>
    </section>

    <section class="wrap bloc" id="parcours" aria-labelledby="parcours-titre">
      <div class="bloc-tete">
        <h2 id="parcours-titre">Parcours</h2>
      </div>
      <ol class="parcours" id="liste-parcours"></ol>
    </section>

    <section class="wrap bloc contact" id="contact" aria-labelledby="contact-titre">
      <div class="bloc-tete">
        <h2 id="contact-titre">Contact</h2>
        <p class="bloc-sous">Stage, projet, question sur S.T.A.R. : écrivez-moi.</p>
      </div>
      <div class="contact-in" id="contact-in"></div>
    </section>
  </main>

  <footer class="wrap">
    <table class="cartouche mono" id="cartouche"></table>
  </footer>

  <dialog id="visionneuse" aria-label="Image agrandie">
    <button class="fermer" id="fermer" aria-label="Fermer">✕</button>
    <img id="visionneuse-img" alt="">
    <p id="visionneuse-leg"></p>
  </dialog>

  <script src="contenu.js"></script>
  <script src="app.js"></script>
</body>
</html>
