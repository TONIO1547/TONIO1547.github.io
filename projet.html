  <!-- Les fichiers du site sont rechargés à chaque visite, pour que les modifications se voient tout de suite -->
  <script>window.V = Date.now(); document.write('<link rel="stylesheet" href="style.css?v=' + window.V + '">');</script>

</head>
<body data-page="projet">

  <header class="nav">

    <img id="visionneuse-img" alt="">
    <p id="visionneuse-leg"></p>
  </dialog>

  <script>
    /* Si contenu.js contient une faute de frappe, on affiche la ligne en cause en haut de la page. */
    window.addEventListener("error", function (e) {
      if (!/contenu\.js/.test(e.filename || "")) return;
      var d = document.createElement("div");
      d.className = "erreur-contenu";
      d.textContent = "Erreur dans contenu.js, ligne " + e.lineno + " : " + e.message + ". En général : une virgule, un guillemet ou une accolade } oubliés juste avant cette ligne.";
      document.body.prepend(d);
    });
  </script>
  <!-- contenu.js est rechargé à chaque visite (pas de cache), pour que tes modifications se voient tout de suite -->
  <script>document.write('<script src="contenu.js?v=' + window.V + '"><\/script>');</script>
  <script>document.write('<script src="app.js?v=' + window.V + '"><\/script>');</script>
</body>
