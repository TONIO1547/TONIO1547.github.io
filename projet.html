  <dialog id="visionneuse" aria-label="Image agrandie">
    <button class="fermer" id="fermer" aria-label="Fermer">✕</button>
    <img id="visionneuse-img" alt="">
    <p id="visionneuse-leg"></p>
  </dialog>

  <script>
    /* Si contenu.js contient une faute de frappe, on affiche la ligne en cause en haut de la page. */
    window.addEventListener("error", function (e) {
      if (!/contenu\.js/.test(e.filename || "")) return;
      var d = document.createElement("div");
      d.className = "erreur-contenu";
      d.textContent = "Erreur dans contenu.js, ligne " + e.lineno + " : " + e.message + ". En général : une virgule, un guillemet ou une accolade } oubliés juste avant cette ligne.";
      document.body.prepend(d);
    });
  </script>
  <script src="contenu.js"></script>
  <script src="app.js"></script>
</body>
